<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Avatar stage</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.js" } }
</script>
<style>
  :root {
    --accent: #4f8cff;
    --bg0: #0d1015;
    --bg1: #070a0f;
    --glow: 0.0;            /* 0..1, driven by the voice level */
  }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg1); }
  body {
    background:
      radial-gradient(60% 55% at 50% 42%,
        color-mix(in srgb, var(--accent) calc(10% + var(--glow) * 22%), transparent) 0%, transparent 70%),
      radial-gradient(120% 90% at 50% 0%, var(--bg0) 0%, var(--bg1) 75%);
    transition: background 0.4s;
  }
  canvas#c {
    position: fixed; inset: 0; width: 100%; height: 100%; display: block;
    outline: none; touch-action: none;
    transition: filter 0.5s ease;
  }
  body.muted canvas#c { filter: saturate(0.55) brightness(0.62); }
  #floor {                      /* soft contact glow under the bust */
    position: fixed; left: 50%; bottom: -12%; width: 70%; height: 34%;
    transform: translateX(-50%);
    background: radial-gradient(closest-side, color-mix(in srgb, var(--accent) 30%, transparent), transparent);
    filter: blur(28px); opacity: 0.55; pointer-events: none;
  }
</style>
</head>
<body>
<div id="floor"></div>
<canvas id="c"></canvas>
<script type="module" src="./viewer.js"></script>
</body>
</html>
